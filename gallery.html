<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Gallery</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css?family=Domine|Noto+Sans|Titillium+Web&subset=latin,latin-ext" rel="stylesheet" type="text/css">
  <style>
    :root {
      --sage-bg: #C9C5B1;
      --panel-bg: rgba(201, 197, 177, 1);
      --text: rgba(0, 0, 0, 1);
      --dark: #434343;
      --light: #f8f7f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--sage-bg);
      color: var(--text);
      font-family: 'Noto Sans', sans-serif;
    }

    .site-header {
      background: rgba(67, 67, 67, 0.96);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .site-nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      padding: 1rem 1.25rem;
    }

    .nav-link {
      color: var(--light);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
      text-decoration: none;
    }

    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 10% 60px;
    }

    .section {
      background: var(--panel-bg);
      padding: 40px 10%;
      margin: 0 0 20px;
    }

    h1, h2 {
      font-family: 'Domine', serif;
      font-weight: bold;
      margin: 0 0 1rem;
    }

    h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      text-align: center;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .gallery-item {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 1rem;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 450px) {
      .page-wrap,
      .section {
        min-width: 380px;
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-link" href="index.html">About Me</a>
      <a class="nav-link active" href="gallery.html" aria-current="page">Gallery</a>
      <a class="nav-link" href="Services.html">Services</a>
      <a class="nav-link" href="Booking.html">Booking</a>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="section">
      <h1>Gallery</h1>
    </section>

    <section class="section">
      <div class="gallery-grid">
        <div class="gallery-item">Sunlit yard time</div>
        <div class="gallery-item">Daily dog routines</div>
        <div class="gallery-item">Country retreat</div>
        <div class="gallery-item">Play and enrichment</div>
        <div class="gallery-item">Rest &amp; recovery</div>
        <div class="gallery-item">Happy tails</div>
      </div>
    </section>
  </main>
</body>
</html>
