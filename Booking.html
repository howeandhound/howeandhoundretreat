<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Booking | Howe &amp; Hound</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css?family=Domine|Noto+Sans|Titillium+Web&subset=latin,latin-ext" rel="stylesheet" type="text/css">
  <style>
    :root {
      --sage-bg: #C9C5B1;
      --panel-bg: rgba(201, 197, 177, 1);
      --text: rgba(0, 0, 0, 1);
      --dark: #434343;
      --light: #f8f7f3;
      --gold: #b89d6a;
      --facebook: #1877F2;
      --instagram: #E1306C;
      --focus: #1d4ed8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--sage-bg);
      color: var(--text);
      font-family: 'Noto Sans', sans-serif;
      line-height: 1.5;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
      z-index: -1;
    }

    .skip-link:focus {
      left: 1rem;
      top: 1rem;
      width: auto;
      height: auto;
      padding: 0.6rem 0.9rem;
      background: #fff;
      color: #000;
      border-radius: 0.35rem;
      z-index: 2000;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      text-decoration: none;
    }

    .site-header {
      background: rgba(67, 67, 67, 0.96);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 1.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-mark {
      width: 170px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .site-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.1rem;
    }

    .nav-link {
      color: var(--light);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
      text-decoration: none;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .social-link:hover {
      text-decoration: none;
      color: #fff;
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .social-link svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: currentColor;
    }

    .facebook-link { background: var(--facebook); }
    .instagram-link { background: var(--instagram); }

    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 16px 60px;
    }

    .section {
      background: var(--panel-bg);
      padding: 32px 16px;
      margin: 0 0 20px;
      border-radius: 0.25rem;
    }

    h1 {
      font-family: 'Domine', serif;
      font-weight: bold;
      font-size: clamp(2.2rem, 4vw, 3rem);
      text-align: center;
      margin: 0;
    }

    .form-help {
      margin: 0 0 1rem;
      text-align: center;
      font-size: 1rem;
    }

    .form-help a {
      color: #0b3a7e;
      text-decoration: underline;
    }

    .booking-frame {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 1000px;
      height: 1400px;
      border: 0;
      background: transparent;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    a:focus-visible,
    button:focus-visible,
    .nav-link:focus-visible,
    .social-link:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-radius: 0.4rem;
    }

    @media (max-width: 820px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
        margin-left: 0;
      }
      .site-nav {
        justify-content: flex-start;
      }
    }

    @media (max-width: 450px) {
      .page-wrap,
      .section {
        padding-left: 10px;
        padding-right: 10px;
      }

      .section {
        padding-top: 24px;
        padding-bottom: 24px;
      }

      .brand-mark {
        width: 145px;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Howe &amp; Hound home">
        <img class="brand-mark" src="assets/logo.svg" alt="Howe &amp; Hound dog logo">
      </a>

      <div class="header-actions">
        <nav class="site-nav" aria-label="Main navigation">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="page2.html">About Me</a>
          <a class="nav-link" href="Services.html">Services</a>
          <a class="nav-link" href="gallery.html">Gallery</a>
          <a class="nav-link active" href="Booking.html" aria-current="page">Booking</a>
        </nav>

        <a
          class="social-link facebook-link"
          href="https://www.facebook.com/share/1EwUXBKA7N/?mibextid=wwXIfr"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Howe &amp; Hound on Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3h-3.1V7.2c0-.9.3-1.5 1.6-1.5H17V2.8c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.3V11H8v3h2.5v8h3z"/></svg>
        </a>

        <a
          class="social-link instagram-link"
          href="https://www.instagram.com/howeandhound?stkn=aHRramltOXhhNTli&utm_source=qr"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Howe &amp; Hound on Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm11.5 1.75a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-wrap">
    <section class="section">
      <h1>Booking</h1>
    </section>

    <section class="section" aria-labelledby="booking-form-title">
      <h2 id="booking-form-title" class="sr-only">Book your service</h2>
      <p class="form-help">
        If the form does not load, you can
        <a href="https://form.jotform.com/3552569cc6a" target="_blank" rel="noopener noreferrer">open the booking form in a new tab</a>.
      </p>

      <iframe
        id="JotFormIFrame-3552569cc6a"
        class="booking-frame"
        title="Howe &amp; Hound Booking Form"
        loading="lazy"
        allow="fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        src="https://form.jotform.com/3552569cc6a">
      </iframe>
    </section>
  </main>

  <script>
    (function () {
      const iframe = document.getElementById('JotFormIFrame-3552569cc6a');
      if (!iframe) return;

      const allowedOrigins = new Set([
        'https://form.jotform.com',
        'https://www.jotform.com'
      ]);

      window.addEventListener('message', function (event) {
        if (!allowedOrigins.has(event.origin)) return;

        if (event.data && typeof event.data === 'object' && 'height' in event.data) {
          const h = Number(event.data.height);
          if (Number.isFinite(h) && h > 300) {
            iframe.style.height = h + 'px';
          }
          return;
        }

        if (typeof event.data === 'string') {
          if (event.data.startsWith('setHeight:')) {
            const h = Number(event.data.split(':')[1]);
            if (Number.isFinite(h) && h > 300) {
              iframe.style.height = h + 'px';
            }
          }
        }
      }, false);
    })();
  </script>
</body>
</html>
