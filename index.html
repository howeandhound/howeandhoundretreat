<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Main Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
  <style>
    body {
      background-color: #C9C5B1;
      margin: 0;
      font-family: 'Noto Sans', sans-serif;
    }

    .page-shell {
      min-height: 100vh;
    }

    #hazelScrollToTop {
      display: none;
      position: fixed;
      bottom: 35px;
      right: 30px;
      z-index: 99;
      border: none;
      outline: none;
      background-color: #434343;
      color: #FFFFFF;
      cursor: pointer;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 30px;
      font-weight: bold;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }

    #hazelScrollToTop:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <button id="hazelScrollToTop" aria-label="Scroll to top"><i class="fas fa-arrow-up"></i></button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const scrollButton = document.getElementById('hazelScrollToTop');
      if (!scrollButton) return;

      const updateScrollButton = function () {
        const shouldShow = window.scrollY > 20 || document.documentElement.scrollTop > 20;
        scrollButton.style.display = shouldShow ? 'block' : 'none';
      };

      window.addEventListener('scroll', updateScrollButton, { passive: true });
      updateScrollButton();

      scrollButton.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  </script>
</body>
</html>
