<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Howe &amp; Hound Retreat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css?family=Domine|Noto+Sans|Titillium+Web&subset=latin,latin-ext" rel="stylesheet" type="text/css">
  <style>
    :root {
      --sage-bg: #C9C5B1;
      --panel-bg: rgba(201, 197, 177, 1);
      --text: rgba(0, 0, 0, 1);
      --dark: #434343;
      --light: #f8f7f3;
      --gold: #b89d6a;
      --facebook: #1877F2;
      --instagram: #E1306C;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--sage-bg);
      color: var(--text);
      font-family: 'Noto Sans', sans-serif;
    }

    .site-header {
      background: rgba(67, 67, 67, 0.96);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 1.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-mark {
      width: 220px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .site-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.1rem;
    }

    .nav-link {
      color: var(--light);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
      text-decoration: none;
    }

    .nav-cta {
      display: inline-block;
      background: var(--gold);
      color: #fff;
      border-radius: 999px;
      padding: 0.6rem 1rem;
      font-weight: 700;
      text-decoration: none;
      margin-left: 0.2rem;
    }

    .nav-cta:hover {
      text-decoration: none;
      color: #fff;
      opacity: 0.92;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .social-link:hover {
      text-decoration: none;
      color: #fff;
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .social-link svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: currentColor;
    }

    .facebook-link { background: var(--facebook); }
    .instagram-link { background: var(--instagram); }

    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 10% 60px;
    }

    .section {
      background: var(--panel-bg);
      padding: 40px 10%;
      margin: 0 0 20px;
    }

    h1, h2, h3 {
      font-family: 'Domine', serif;
      font-weight: bold;
      margin: 0 0 1rem;
    }

    h1 {
      font-size: clamp(2.3rem, 4vw, 3rem);
      text-align: center;
    }

    p {
      margin: 0 0 1rem;
      font-size: 1.08rem;
      line-height: 1.75;
    }

    .hero {
      text-align: center;
    }

    .cta-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .btn-link {
      display: inline-block;
      background: var(--dark);
      color: #fff;
      border-radius: 999px;
      padding: 0.9rem 1.4rem;
      text-decoration: none;
      font-weight: 700;
    }

    .btn-link:hover {
      color: #fff;
      text-decoration: none;
      opacity: 0.92;
    }

    @media (max-width: 820px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
        margin-left: 0;
      }
      .site-nav {
        justify-content: flex-start;
      }
    }

    @media (max-width: 450px) {
      .page-wrap,
      .section {
        min-width: 380px;
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand-mark {
        width: 145px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Howe &amp; Hound home">
        <img class="brand-mark" src="assets/logo.png" alt="Howe &amp; Hound logo with three dogs">
      </a>

      <div class="header-actions">
        <nav class="site-nav" aria-label="Main navigation">
          <a class="nav-link active" href="index.html" aria-current="page">Home</a>
          <a class="nav-link" href="page2.html">About Me</a>
          <a class="nav-link" href="Services.html">Services</a>
          <a class="nav-link" href="gallery.html">Gallery</a>
          <a class="nav-cta" href="Booking.html">Book Now</a>
        </nav>

        <a class="social-link facebook-link" href="https://www.facebook.com/share/1EwUXBKA7N/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Visit Howe &amp; Hound on Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3h-3.1V7.2c0-.9.3-1.5 1.6-1.5H17V2.8c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.3V11H8v3h2.5v8h3z"/></svg>
        </a>

        <a class="social-link instagram-link" href="https://www.instagram.com/howeandhound?stkn=aHRramltOXhhNTli&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Visit Howe &amp; Hound on Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A5.5 5.5 0 1 1 6.5 13 5.5 5.5 0 0 1 12 7.5zm0 2A3.5 3.5 0 1 0 15.5 13 3.5 3.5 0 0 0 12 9.5zm5.25-3.25a1.25 1.25 0 1 1-1.25 1.25 1.25 1.25 0 0 1 1.25-1.25z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <section class="section hero">
      <h1>Howe &amp; Hound Retreat</h1>
      <p>Small, personal dog care in a peaceful countryside setting, with time, attention, and structure built around every dog.</p>
      <div class="cta-row">
        <a class="btn-link" href="Services.html">Explore Services</a>
        <a class="btn-link" href="Booking.html">Book a Visit</a>
      </div>
    </section>
  </main>
</body>
</html>
