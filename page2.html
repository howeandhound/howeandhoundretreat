<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #C9C5B1;
      font-family: 'Noto Sans', sans-serif;
      margin: 0;
      color: rgba(0, 0, 0, 1);
    }

    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 10%;
    }

    .section {
      background-color: rgba(201, 197, 177, 1);
      padding: 40px 10%;
      margin: 0 0 20px;
    }

    h1 {
      font-family: 'Domine', serif;
      font-size: 30pt;
      font-weight: bold;
      text-align: center;
      margin: 0;
    }

    .booking-frame {
      margin-top: 0;
      width: 100%;
      min-width: 320px;
      height: 1500px;
      border: none;
      display: block;
    }

    @media (max-width: 450px) {
      .page-wrap,
      .section {
        min-width: 380px;
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css?family=Domine|Noto+Sans|Titillium+Web|&subset=latin,latin-ext" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="page-wrap">
    <div class="section">
      <h1>Booking</h1>
    </div>

    <div class="section">
      <iframe
        id="JotFormIFrame-3552569cc6a"
        class="booking-frame"
        title="Booking Form"
        allowtransparency="true"
        allowfullscreen="true"
        scrolling="auto"
        src="https://form.jotform.com/3552569cc6a">
      </iframe>
    </div>
  </div>

  <script>
    (function () {
      var iframe = document.getElementById('JotFormIFrame-3552569cc6a');
      if (!iframe) return;

      window.addEventListener('message', function (event) {
        if (event.origin && event.origin.indexOf('jotform.com') !== -1 && event.data && event.data.height) {
          iframe.style.height = event.data.height + 'px';
        }
      }, false);
    })();
  </script>
</body>
</html>
